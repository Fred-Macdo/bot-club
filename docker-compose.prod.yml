# Production Docker Compose Override
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Requires a production .env file at ./backend/.env with all secrets configured.
# See backend/.env.example for required variables.

services:
  backend:
    volumes: []  # No source code bind mount in production
    environment:
      - MONGO_URL=mongodb://${MONGO_USERNAME:-botclub}:${MONGO_PASSWORD}@mongo:27017/bot_club_db?authSource=admin
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - LOCAL_DB=true
      - MONGO_DB_NAME=bot_club_db
      - NODE_ENV=production
      - SERVICE_NAME=backend
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  celery_worker:
    volumes: []
    stop_grace_period: 120s
    environment:
      - MONGO_URL=mongodb://${MONGO_USERNAME:-botclub}:${MONGO_PASSWORD}@mongo:27017/bot_club_db?authSource=admin
      - MONGO_DB=bot_club_db
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - LOCAL_DB=true
      - NODE_ENV=production
      - SERVICE_NAME=celery_worker
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  celery_beat:
    volumes: []
    environment:
      - MONGO_URL=mongodb://${MONGO_USERNAME:-botclub}:${MONGO_PASSWORD}@mongo:27017/bot_club_db?authSource=admin
      - MONGO_DB=bot_club_db
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - LOCAL_DB=true
      - NODE_ENV=production
      - SERVICE_NAME=celery_beat
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  flower:
    volumes: []
    command: celery -A src.celery_app flower --port=5555 --basic-auth=${FLOWER_USER}:${FLOWER_PASSWORD}
    ports: []  # Not exposed externally in prod — access via nginx
    environment:
      - MONGO_URL=mongodb://${MONGO_USERNAME:-botclub}:${MONGO_PASSWORD}@mongo:27017/bot_club_db?authSource=admin
      - MONGO_DB=bot_club_db
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - LOCAL_DB=true
      - NODE_ENV=production
      - SERVICE_NAME=flower
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    volumes: []
    ports: []  # Served via nginx in prod
    environment:
      - NODE_ENV=production
      - REACT_APP_API_URL=  # Empty — nginx proxies /api to backend
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  mongo:
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME:-botclub}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
      - MONGO_INITDB_DATABASE=bot_club_db
    ports: []  # Not exposed externally in prod
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  redis:
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports: []  # Not exposed externally in prod
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
